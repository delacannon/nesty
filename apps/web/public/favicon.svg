<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- background -->
  <rect width="32" height="32" fill="#1a1a2e"/>
  <!-- cartridge body -->
  <rect x="6"  y="4"  width="20" height="24" fill="#2d2d44"/>
  <rect x="6"  y="4"  width="20" height="24" fill="none" stroke="#0f0f1a" stroke-width="1"/>
  <!-- top ridges -->
  <rect x="8"  y="6"  width="2" height="3" fill="#4a4a6a"/>
  <rect x="12" y="6"  width="2" height="3" fill="#4a4a6a"/>
  <rect x="16" y="6"  width="2" height="3" fill="#4a4a6a"/>
  <rect x="20" y="6"  width="2" height="3" fill="#4a4a6a"/>
  <!-- label -->
  <rect x="8"  y="11" width="16" height="10" fill="#e94560"/>
  <rect x="8"  y="11" width="16" height="3"  fill="#ffd23f"/>
  <!-- pixel "N" glyph on label -->
  <rect x="11" y="15" width="1.5" height="4" fill="#1a1a2e"/>
  <rect x="14" y="15" width="1.5" height="4" fill="#1a1a2e"/>
  <rect x="12" y="16" width="1.5" height="1.5" fill="#1a1a2e"/>
  <rect x="13" y="17" width="1.5" height="1.5" fill="#1a1a2e"/>
  <rect x="17" y="15" width="1.5" height="4" fill="#1a1a2e"/>
  <rect x="18" y="15" width="2.5" height="1.5" fill="#1a1a2e"/>
  <!-- connector bottom -->
  <rect x="8"  y="23" width="16" height="4" fill="#16161f"/>
  <rect x="9"  y="24" width="1" height="3" fill="#ffd23f"/>
  <rect x="11" y="24" width="1" height="3" fill="#ffd23f"/>
  <rect x="13" y="24" width="1" height="3" fill="#ffd23f"/>
  <rect x="15" y="24" width="1" height="3" fill="#ffd23f"/>
  <rect x="17" y="24" width="1" height="3" fill="#ffd23f"/>
  <rect x="19" y="24" width="1" height="3" fill="#ffd23f"/>
  <rect x="21" y="24" width="1" height="3" fill="#ffd23f"/>
</svg>
