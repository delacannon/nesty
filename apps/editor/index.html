<!doctype html>
<html lang="en" data-theme="pc98">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>NESty — Make Narrative NES Adventure Games in Your Browser</title>
    <meta
      name="description"
      content="NESty is a free browser-based NES game generator for building narrative adventure games. Design rooms, dialogue, and stories, then export real .nes ROMs you can play on any NES emulator or cartridge."
    />
    <meta
      name="keywords"
      content="NES game generator, make NES games, narrative adventure games, NES adventure maker, browser NES editor, .nes ROM export, retro game creator, 8-bit game maker, interactive fiction NES, homebrew NES"
    />
    <meta name="author" content="NESty" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="canonical" href="https://nesty.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NESty" />
    <meta property="og:url" content="https://nesty.app/" />
    <meta
      property="og:title"
      content="NESty — Make Narrative NES Adventure Games in Your Browser"
    />
    <meta
      property="og:description"
      content="Free browser-based NES game generator for narrative adventures. Build rooms, dialogue, and stories, then export real .nes ROMs playable on any emulator or cartridge."
    />
    <meta property="og:image" content="https://nesty.app/og-image.png" />
    <meta property="og:image:alt" content="NESty NES adventure game editor" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="NESty — Make Narrative NES Adventure Games in Your Browser"
    />
    <meta
      name="twitter:description"
      content="Free browser-based NES game generator for narrative adventures. Design your story, export real .nes ROMs, play anywhere."
    />
    <meta name="twitter:image" content="https://nesty.app/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "NESty",
        "description": "Free browser-based NES game generator for building narrative adventure games and exporting real .nes ROMs.",
        "url": "https://nesty.app/",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
